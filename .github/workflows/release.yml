name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One release at a time, so two runs can never claim the same version tag.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["22.x", "24.x"]
    steps:
      - uses: actions/checkout@v5
      - name: Reject non-pnpm lockfiles
        run: |
          for f in package-lock.json yarn.lock bun.lock bun.lockb; do
            [ -e "$f" ] && { echo "::error::$f committed — this repo uses pnpm: corepack enable && pnpm install"; exit 1; }
          done; true
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      # Fails the PR if package.json and pnpm-lock.yaml drifted apart, which is
      # what happens when someone adds a dependency with another package manager.
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm test
      - run: pnpm run build

  release:
    # Only after green tests on main, and never in response to the release commit itself.
    needs: test
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      !startsWith(github.event.head_commit.message, 'chore: release')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Bump version, commit and tag
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pick up any release another run just pushed, so the bump lands on top of it.
          git pull --rebase origin main
          pnpm version patch --message "chore: release v%s [skip ci]"
          # pnpm version prints prose, not the tag, so read the result back.
          echo "version=v$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          git push --follow-tags origin main

      - name: Pack the published tarball
        run: |
          # The preinstall guard is for contributors working in a checkout; shipping
          # it would make npm warn about install scripts on every user's install.
          node -e "const f='package.json',p=require('./'+f);delete p.scripts.preinstall;require('fs').writeFileSync(f,JSON.stringify(p,null,2)+'\n')"
          pnpm pack
          # Stable filename so the install command never has to name a version.
          cp sojaner-telex-*.tgz telex.tgz

      - name: Publish to npm
        # Skipped rather than failed while the scope has no token, so the GitHub
        # release still goes out.
        if: ${{ secrets.NPM_TOKEN != '' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # Publishes the very tarball attached to the release, not a second build.
        run: npm publish sojaner-telex-*.tgz --access public

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.bump.outputs.version }}" \
            --title "${{ steps.bump.outputs.version }}" \
            --generate-notes \
            telex.tgz sojaner-telex-*.tgz
